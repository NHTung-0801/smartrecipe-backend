spring:
  application:
    name: smartrecipe-backend

  # Database Configuration
  # Local: đọc từ .env hoặc dùng default localhost
  # Production (Render): đọc từ Environment Variables
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_recipe_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}"
    username: "${SPRING_DATASOURCE_USERNAME:root}"
    password: "${SPRING_DATASOURCE_PASSWORD:root}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET NAMES utf8mb4"

  # JPA & Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Redis Configuration
  # Local: localhost:6379 (Docker)
  # Production (Render): Upstash Redis với SSL
  data:
    redis:
      host: "${SPRING_DATA_REDIS_HOST:localhost}"
      port: "${SPRING_DATA_REDIS_PORT:6379}"
      password: "${SPRING_DATA_REDIS_PASSWORD:}"
      ssl:
        enabled: "${SPRING_DATA_REDIS_SSL_ENABLED:false}"

app:
  jwt:
    secret: ${JWT_SECRET:U21hcnRSZWNpcGVfU3VwZXJTZWNyZXRLZXlfMjAyNl8xMjM0NTY3ODkw}
    expirationMs: ${JWT_EXPIRATION:86400000}
    refreshExpirationMs: ${JWT_REFRESH_EXPIRATION:604800000}

# Google Gemini AI
gemini:
  api-key: ${GEMINI_API_KEY:your_gemini_api_key_here}
  model: ${GEMINI_MODEL:gemini-3-flash-preview}
  daily-limit: 10

# Cloudinary (Image Upload)
# CLOUDINARY_URL được đọc trực tiếp bởi CloudinaryConfig.java qua @Value("${CLOUDINARY_URL}")
# Không cần khai báo thêm trong yaml — chỉ cần set env var CLOUDINARY_URL trên Render
# Format: cloudinary://<api_key>:<api_secret>@<cloud_name>

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

# Spring Boot Actuator — expose health endpoint cho CI/CD health check
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never
